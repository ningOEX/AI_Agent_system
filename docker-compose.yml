# ============================================================
# 生产部署编排：MongoDB + Express 后端 + Nginx(两个前端 + 反向代理)
# 使用方式：cp .env.example .env  →  改好里面的值  →  docker compose up -d --build
# ============================================================
name: ai-agent-blog

services:
  # ---------------- MongoDB ----------------
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-app}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - mongo-data:/data/db
    networks:
      - internal
    # 不对宿主机暴露 27017，只允许内部网络访问
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --username
        - ${MONGO_ROOT_USER:-app}
        - --password
        - ${MONGO_ROOT_PASSWORD}
        - --authenticationDatabase
        - admin
        - --eval
        - db.adminCommand('ping')
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ---------------- 后端 API ----------------
  api:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      TZ: Asia/Shanghai
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-app}:${MONGO_ROOT_PASSWORD}@mongo:27017/login_demo?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-2h}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN}
      CAPTCHA_ENABLED: ${CAPTCHA_ENABLED:-true}
      SMS_ENABLED: ${SMS_ENABLED:-false}
      CONTENT_FILTER_ENABLED: ${CONTENT_FILTER_ENABLED:-true}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-oss-cn-hangzhou.aliyuncs.com}
      OSS_BUCKET: ${OSS_BUCKET:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      CHAT_MODEL: ${CHAT_MODEL:-qwen-plus}
    volumes:
      # 本地存储模式的上传文件持久化到宿主机
      - ./server/uploads:/app/uploads
    networks:
      - internal
    depends_on:
      mongo:
        condition: service_healthy

  # ---------------- 前端静态托管 + 网关 ----------------
  # 低成本方案：前端在本地/CI 构建，服务器只挂载 dist 静态文件，完全不参与构建
  # 产物目录由 scripts/build-frontend.ps1 生成：
  #   ./dist/blog  ← blog-web/dist
  #   ./dist/admin ← client/dist
  # 如需在服务器上构建（需 ≥4G 内存），先建镜像再把镜像名传进来：
  #   docker build -f Dockerfile.web -t ai-agent-web:local .
  #   WEB_IMAGE=ai-agent-web:local docker compose up -d
  web:
    image: ${WEB_IMAGE:-nginx:1.27-alpine}
    restart: unless-stopped
    ports:
      # 无域名方案：直接 公网IP:端口 访问
      - "${BLOG_PORT:-80}:${BLOG_PORT:-80}"
      - "${ADMIN_PORT:-8081}:${ADMIN_PORT:-8081}"
      - "443:443"
    environment:
      BLOG_PORT: ${BLOG_PORT:-80}
      ADMIN_PORT: ${ADMIN_PORT:-8081}
      API_UPSTREAM: api:5000
    volumes:
      # 两个前端的构建产物（只读挂载）
      - ./dist/blog:/usr/share/nginx/html/blog:ro
      - ./dist/admin:/usr/share/nginx/html/admin:ro
      # 官方 nginx 镜像启动时用 envsubst 渲染 templates/*.template → conf.d/*.conf
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      # 启用 HTTPS 时把证书放这里（未启用时该目录为空也不影响启动）
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - internal
    depends_on:
      - api

volumes:
  mongo-data:

networks:
  internal:
    driver: bridge
