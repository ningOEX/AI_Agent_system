<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#8b949e"/>
    </marker>
    <style>
      .layer { fill: #f6f8fa; stroke: #d0d7de; rx: 10; }
      .box { fill: #ffffff; stroke: #d0d7de; }
      .box-blue { fill: #ddf4ff; stroke: #54aeff; }
      .box-green { fill: #dafbe1; stroke: #4ac26b; }
      .box-orange { fill: #fff1e5; stroke: #e16f24; }
      .box-purple { fill: #fbefff; stroke: #a371f7; }
      .t { fill: #1f2328; font-size: 15px; font-weight: 600; }
      .s { fill: #656d76; font-size: 12px; }
      .lt { fill: #656d76; font-size: 12px; font-weight: 600; letter-spacing: 2px; }
      .arr { stroke: #8b949e; stroke-width: 1.5; fill: none; }
      .lbl { fill: #656d76; font-size: 11px; }
    </style>
  </defs>

  <!-- ================= 访问层 ================= -->
  <text class="lt" x="30" y="40">访问层</text>
  <g>
    <rect class="box" x="60" y="55" width="200" height="64" rx="8"/>
    <text class="t" x="160" y="82" text-anchor="middle">访客 / 普通用户</text>
    <text class="s" x="160" y="104" text-anchor="middle">浏览器 · 无需登录可读博客</text>
  </g>
  <g>
    <rect class="box" x="700" y="55" width="200" height="64" rx="8"/>
    <text class="t" x="800" y="82" text-anchor="middle">管理员 / 作者</text>
    <text class="s" x="800" y="104" text-anchor="middle">浏览器 · JWT 登录</text>
  </g>

  <!-- ================= 网关层 ================= -->
  <text class="lt" x="30" y="165">网关层</text>
  <rect class="layer" x="60" y="150" width="840" height="120" rx="10"/>
  <g>
    <rect class="box-blue" x="90" y="170" width="240" height="80" rx="8"/>
    <text class="t" x="210" y="200" text-anchor="middle">Nginx（web 容器）</text>
    <text class="s" x="210" y="222" text-anchor="middle">:80 前台 dist/blog · :8081 后台 dist/admin</text>
    <text class="s" x="210" y="240" text-anchor="middle">/api 反代 · SSE 关缓冲 · gzip · SPA 回退</text>
  </g>
  <g>
    <rect class="box" x="380" y="170" width="230" height="80" rx="8"/>
    <text class="t" x="495" y="200" text-anchor="middle">blog-web 前台</text>
    <text class="s" x="495" y="222" text-anchor="middle">Vue 3 + Tailwind + GSAP</text>
    <text class="s" x="495" y="240" text-anchor="middle">阅读 / 评论 / 智能客服</text>
  </g>
  <g>
    <rect class="box" x="640" y="170" width="230" height="80" rx="8"/>
    <text class="t" x="755" y="200" text-anchor="middle">client 后台 CMS</text>
    <text class="s" x="755" y="222" text-anchor="middle">Vben Admin 5 + Ant Design Vue</text>
    <text class="s" x="755" y="240" text-anchor="middle">内容 / 客服 / 监控 / 留痕</text>
  </g>
  <path class="arr" d="M180 119 L200 162" marker-end="url(#ar)"/>
  <path class="arr" d="M790 119 L770 162" marker-end="url(#ar)"/>

  <!-- ================= 服务层 ================= -->
  <text class="lt" x="30" y="325">服务层</text>
  <rect class="layer" x="60" y="310" width="840" height="120" rx="10"/>
  <g>
    <rect class="box-green" x="90" y="330" width="300" height="80" rx="8"/>
    <text class="t" x="240" y="358" text-anchor="middle">Express API（api 容器）</text>
    <text class="s" x="240" y="380" text-anchor="middle">JWT + RBAC 权限 · 图形/短信验证码</text>
    <text class="s" x="240" y="398" text-anchor="middle">限流 · 敏感词 · SSE 流式输出</text>
  </g>
  <g>
    <rect class="box" x="420" y="330" width="210" height="80" rx="8"/>
    <text class="t" x="525" y="358" text-anchor="middle">横切中间件</text>
    <text class="s" x="525" y="380" text-anchor="middle">接口监控埋点</text>
    <text class="s" x="525" y="398" text-anchor="middle">操作留痕（含快照回滚）</text>
  </g>
  <g>
    <rect class="box" x="660" y="330" width="210" height="80" rx="8"/>
    <text class="t" x="765" y="358" text-anchor="middle">定时任务</text>
    <text class="s" x="765" y="380" text-anchor="middle">定时发布扫描（30s）</text>
    <text class="s" x="765" y="398" text-anchor="middle">TTL 索引自动清理</text>
  </g>
  <path class="arr" d="M495 250 L495 322" marker-end="url(#ar)"/>
  <path class="arr" d="M755 250 L765 322" marker-end="url(#ar)"/>
  <path class="arr" d="M250 250 L255 322" marker-end="url(#ar)"/>
  <text class="lbl" x="510" y="290">/api 同源反代</text>

  <!-- ================= 数据与外部服务层 ================= -->
  <text class="lt" x="30" y="485">数据层 / 外部服务</text>
  <rect class="layer" x="60" y="470" width="840" height="120" rx="10"/>
  <g>
    <rect class="box-orange" x="90" y="490" width="240" height="80" rx="8"/>
    <text class="t" x="210" y="518" text-anchor="middle">MongoDB（mongo 容器）</text>
    <text class="s" x="210" y="540" text-anchor="middle">用户 / 文章 / 评论 / 通知 / 会话</text>
    <text class="s" x="210" y="558" text-anchor="middle">Docker 命名卷持久化 · 内网隔离</text>
  </g>
  <g>
    <rect class="box-purple" x="400" y="490" width="220" height="80" rx="8"/>
    <text class="t" x="510" y="518" text-anchor="middle">DashScope 大模型</text>
    <text class="s" x="510" y="540" text-anchor="middle">AI 写作 · 文生图 · 客服兜底</text>
    <text class="s" x="510" y="558" text-anchor="middle">SSE 流式 · 120s 超时</text>
  </g>
  <g>
    <rect class="box-purple" x="660" y="490" width="210" height="80" rx="8"/>
    <text class="t" x="765" y="518" text-anchor="middle">阿里云 OSS</text>
    <text class="s" x="765" y="540" text-anchor="middle">封面图 / 头像 · 后端中转上传</text>
    <text class="s" x="765" y="558" text-anchor="middle">替换后异步清理旧文件</text>
  </g>
  <path class="arr" d="M240 410 L220 482" marker-end="url(#ar)"/>
  <path class="arr" d="M400 380 L480 482" marker-end="url(#ar)"/>
  <path class="arr" d="M620 380 L740 482" marker-end="url(#ar)"/>
</svg>
